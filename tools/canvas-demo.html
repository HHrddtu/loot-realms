<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Demo — процедурные текстуры Loot Realms</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: #0a0a1a;
            color: #ddd;
            min-height: 100vh;
            padding: 16px;
            user-select: none;
        }
        h1 {
            text-align: center;
            color: #f1c40f;
            margin-bottom: 4px;
            font-size: 22px;
            text-shadow: 0 0 12px rgba(241,196,15,.4);
        }
        .sub {
            text-align: center;
            color: #7f8c8d;
            font-size: 12px;
            margin-bottom: 14px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        button {
            padding: 8px 18px;
            font-size: 13px;
            font-family: inherit;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #1a1a2e;
            color: #f1c40f;
            border: 1px solid #444;
            transition: all .15s ease;
        }
        button:hover { background: #2a2a4e; transform: translateY(-1px); }
        button.active { background: #f1c40f; color: #1a1a2e; border-color: #f1c40f; }
        button:disabled { opacity: .4; cursor: default; transform: none; }
        .main {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .canvas-wrap {
            background: #111125;
            border: 2px solid #2a2a4e;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        #stage {
            background: #0d0d1f;
            border: 1px solid #333;
            border-radius: 4px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .status {
            margin-top: 8px;
            font-size: 12px;
            color: #7f8c8d;
        }
        .status b { color: #f1c40f; }
        .code {
            background: #111125;
            border: 2px solid #2a2a4e;
            border-radius: 10px;
            padding: 12px;
            max-width: 520px;
            min-width: 380px;
            font-size: 12px;
            line-height: 1.55;
            max-height: 520px;
            overflow: hidden;
        }
        .code-head {
            color: #9b59b6;
            margin-bottom: 8px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .code-line {
            white-space: pre;
            color: #6c7a89;
        }
        .code-line.current {
            background: rgba(241,196,15,.15);
            border-left: 3px solid #f1c40f;
            color: #f1c40f;
            padding-left: 6px;
            margin-left: -6px;
        }
        .code-line.current .cl { color: #2ecc71; }
        .code-line.current .cv { color: #e67e22; }
        .prog { margin-top: 10px; height: 6px; background: #1a1a2e; border-radius: 3px; overflow: hidden; }
        .prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#9b59b6,#f1c40f); transition: width .05s linear; }
        .hint {
            margin-top: 14px;
            text-align: center;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Loot Realms — как код рисует текстуры</h1>
    <div class="sub">все спрайты генерируются на Canvas 2D при старте игры — 0 файлов-картинок</div>

    <div class="controls">
        <button id="btn-sage" class="active">Sage</button>
        <button id="btn-alchemist">Alchemist</button>
        <button id="btn-angel">Angel</button>
        <span style="width:8px"></span>
        <button id="btn-play">▶ Play</button>
        <button id="btn-step">Step +1</button>
        <button id="btn-restart">⟲ Restart</button>
        <span style="width:8px"></span>
        <button id="btn-grid">Grid: on</button>
    </div>

    <div class="main">
        <div class="canvas-wrap">
            <canvas id="stage" width="320" height="480"></canvas>
            <div class="status">операция <b id="cur-op">—</b> из <b id="total-op">0</b> · текстура <b id="tex-size">32×48</b> · зум <b id="zoom-label">10x</b></div>
            <div class="prog"><div class="prog-fill" id="prog-fill"></div></div>
        </div>
        <div class="code">
            <div class="code-head">src/textures/player.js — текущая команда</div>
            <div id="code-box"></div>
        </div>
    </div>

    <div class="hint">пробел = play/pause · стрелки = шаг · каждая команда = один вызов canvas API</div>

    <script>
        // ====== Функции отрисовки (из src/textures/player.js) ======

            mk('player_alchemist', 32, 48, (c) => {
                c.imageSmoothingEnabled = false;
                c.fillStyle = '#5a3d1a';
                c.fillRect(8, 0, 16, 4);
                c.fillRect(6, 4, 20, 4);
                c.fillRect(4, 8, 24, 4);

                c.fillRect(10, 1, 12, 2);

                c.fillStyle = '#b4855a';
                c.fillRect(11, 15, 10, 6);
                c.fillStyle = '#a4754a';
                c.fillRect(11, 17, 2, 1);
                c.fillRect(17, 17, 2, 1);
                c.fillStyle = '#6b4423';
                c.fillRect(10, 20, 12, 4);
                c.fillRect(8, 22, 16, 4);
                c.fillRect(10, 26, 12, 2);
                c.fillStyle = '#7a5a33';
                c.fillRect(8, 23, 2, 3);
                c.fillRect(22, 23, 2, 3);
                c.fillRect(10, 27, 2, 2);
                c.fillRect(20, 27, 2, 2);
                c.fillStyle = '#5a3d1a';
                c.fillRect(6, 14, 20, 16);
                c.fillStyle = '#6b4423';
                c.fillRect(8, 16, 16, 12);
                c.fillStyle = '#8b6914';
                c.fillRect(6, 28, 20, 2);
                c.fillStyle = '#3d2b1f';
                c.fillRect(6, 26, 20, 2);
                c.fillStyle = '#f1c40f';
                c.fillRect(14, 25, 4, 4);
                c.fillStyle = '#5a3d1a';
                c.fillRect(2, 16, 4, 12);
                c.fillRect(26, 16, 4, 12);
                c.fillStyle = '#c4956a';
                c.fillRect(2, 28, 4, 4);
                c.fillRect(26, 28, 4, 4);
                c.fillStyle = '#27ae60';
                c.fillRect(0, 24, 6, 8);
                c.fillStyle = '#2ecc71';
                c.fillRect(1, 25, 4, 5);
                c.fillStyle = '#5a3d1a';
                c.fillRect(1, 23, 4, 2);

                c.fillRect(0, 22, 6, 8);
                c.fillStyle = '#3d2b1f';

            mk('player_angel', 32, 48, (c) => {

                c.fillRect(10, 0, 12, 2);
                c.fillRect(8, 1, 16, 1);
                c.fillStyle = '#ecf0f1';
                c.fillRect(0, 10, 6, 8);
                c.fillRect(26, 10, 6, 8);
                c.fillStyle = '#ffffff';
                c.fillRect(1, 11, 4, 6);
                c.fillRect(27, 11, 4, 6);

                c.fillRect(30, 12, 2, 4);
                c.fillRect(1, 14, 1, 3);
                c.fillRect(30, 14, 1, 3);
                c.fillStyle = 'rgba(241,196,15,0.1)';
                c.fillRect(0, 8, 6, 10);
                c.fillRect(26, 8, 6, 10);
                c.fillStyle = '#ecf0f1';
                c.fillRect(6, 14, 20, 16);
                c.fillStyle = '#ffffff';
                c.fillRect(8, 16, 16, 12);
                c.fillStyle = '#f1c40f';
                c.fillRect(6, 28, 20, 2);
                c.fillRect(14, 18, 4, 6);
                c.fillRect(12, 20, 8, 2);
                c.fillStyle = '#ecf0f1';
                c.fillRect(2, 16, 4, 12);
                c.fillRect(26, 16, 4, 12);
                c.fillStyle = '#fdebd0';
                c.fillRect(2, 28, 4, 4);
                c.fillRect(26, 28, 4, 4);
                c.fillStyle = '#8b4513';
                c.fillRect(27, 18, 2, 14);
                c.fillStyle = '#a0522d';
                c.fillRect(25, 20, 6, 8);
                c.fillStyle = '#f5f5dc';
                c.fillRect(26, 21, 4, 6);
                c.fillStyle = '#8b4513';
                c.fillRect(28, 16, 2, 4);
                c.fillStyle = '#ecf0f1';
                c.fillRect(10, 30, 5, 10);
                c.fillRect(17, 30, 5, 10);
                c.fillStyle = '#f1c40f';

                c.fillRect(17, 38, 6, 6);
            });
        }

        // ====== Движок демо ======
        const ZOOM = 10;
        const stage = document.getElementById('stage');
        const sctx = stage.getContext('2d');
        sctx.imageSmoothingEnabled = false;

        let commands = [];   // [{type:'fillStyle'|'fillRect'|'set', ...}]
        let idx = 0;
        let playing = false;
        let gridOn = true;
        let timer = null;

        function captureTexture(drawFn, w, h) {
            const commands_ = [];
            const proxy = new Proxy({}, {
                get(t, prop) {
                    if (prop === 'imageSmoothingEnabled') return false;
                    return (...args) => {
                        if (prop === 'fillRect') commands_.push({ type: 'fillRect', args: [...args], fill: proxy.__fill });
                        else if (prop === 'beginPath' || prop === 'fill' || prop === 'stroke' || prop === 'closePath' || prop === 'arc') {
                            commands_.push({ type: 'misc', name: prop, args: [...args] });
                        }
                        return undefined;
                    };
                },
                set(t, prop, val) {
                    if (prop === 'fillStyle') { proxy.__fill = val; commands_.push({ type: 'fillStyle', value: val }); return true; }
                    return true;
                }
            });
            try { drawFn(proxy); } catch (e) { console.error(e); }
            return commands_.filter(c => c.type === 'fillStyle' || c.type === 'fillRect');
        }

        const TEXTURES = {};
        (() => {
            const mk = (key, w, h, drawFn) => { TEXTURES[key] = { w, h, drawFn }; };
            drawPlayerTextures(mk);
        })();

        let currentKey = 'player_sage';

        function render(stageIdx) {
            const t = TEXTURES[currentKey];
            sctx.clearRect(0, 0, stage.width, stage.height);
            const px = ZOOM;
            const offX = (stage.width - t.w * px) / 2;
            const offY = (stage.height - t.h * px) / 2;

            // background
            sctx.fillStyle = '#0d0d1f';
            sctx.fillRect(0, 0, stage.width, stage.height);

            let curFill = null;
            for (let i = 0; i < Math.min(stageIdx, commands.length); i++) {
                const c = commands[i];
                if (c.type === 'fillStyle') { curFill = c.value; continue; }
                const [x, y, w, h] = c.args;
                sctx.fillStyle = curFill;
                sctx.fillRect(offX + x * px, offY + y * px, w * px, h * px);
            }

            // highlight current rect
            const cur = commands[Math.min(stageIdx, commands.length) - 1];
            if (cur && cur.type === 'fillRect' && stageIdx <= commands.length) {
                const [x, y, w, h] = cur.args;
                sctx.strokeStyle = '#ffffff';
                sctx.lineWidth = 2;
                sctx.strokeRect(offX + x * px, offY + y * px, w * px, h * px);
            }

            // grid
            if (gridOn) {
                sctx.strokeStyle = 'rgba(255,255,255,0.08)';
                sctx.lineWidth = 1;
                for (let gx = 0; gx <= t.w; gx++) {
                    sctx.beginPath(); sctx.moveTo(offX + gx * px, offY); sctx.lineTo(offX + gx * px, offY + t.h * px); sctx.stroke();
                }
                for (let gy = 0; gy <= t.h; gy++) {
                    sctx.beginPath(); sctx.moveTo(offX, offY + gy * px); sctx.lineTo(offX + t.w * px, offY + gy * px); sctx.stroke();
                }
            }

            // progress
            document.getElementById('prog-fill').style.width = (commands.length ? (Math.min(stageIdx, commands.length) / commands.length) * 100 : 0) + '%';
            document.getElementById('cur-op').textContent = Math.min(stageIdx, commands.length);
            document.getElementById('total-op').textContent = commands.length;
            document.getElementById('tex-size').textContent = t.w + '\u00d7' + t.h;
            updateCode(stageIdx);
        }

        function fmtColor(v) {
            if (typeof v === 'string' && v.startsWith('#')) return '<span class="cv">\'' + v + '\'</span>';
            return '<span class="cv">\'' + v + '\'</span>';
        }

        function updateCode(stageIdx) {
            const box = document.getElementById('code-box');
            box.innerHTML = '';
            const start = Math.max(0, Math.min(stageIdx, commands.length) - 6);
            const end = Math.min(stageIdx + 4, commands.length);
            for (let i = start; i < end; i++) {
                const c = commands[i];
                const isCur = i === Math.min(stageIdx, commands.length) - 1 && stageIdx <= commands.length && i === stageIdx - 1;
                let html;
                if (c.type === 'fillStyle') html = 'c.fillStyle = ' + fmtColor(c.value) + ';';
                else html = 'c.fillRect(' + c.args.join(', ') + ');';
                const div = document.createElement('div');
                div.className = 'code-line' + (isCur ? ' current' : '');
                div.innerHTML = html.replace(/<span class="cv">/, '<span class="cv">').replace('</span>', '</span>');
                if (isCur) div.innerHTML = html;
                box.appendChild(div);
            }
        }

        function loadTexture(key) {
            currentKey = key;
            commands = captureTexture(TEXTURES[key].drawFn, TEXTURES[key].w, TEXTURES[key].h);
            idx = 0;
            stop();
            render(0);
        }

        function step() {
            if (idx < commands.length) idx++;
            render(idx);
        }

        function play() {
            if (playing) return;
            playing = true;
            document.getElementById('btn-play').textContent = '\u23f8 Pause';
            timer = setInterval(() => {
                if (idx < commands.length) idx++;
                render(idx);
                if (idx >= commands.length) stop();
            }, 40);
        }

        function stop() {
            playing = false;
            document.getElementById('btn-play').textContent = '\u25b6 Play';
            if (timer) { clearInterval(timer); timer = null; }
        }

        // UI
        document.getElementById('btn-sage').onclick = () => { setChar('player_sage'); };
        document.getElementById('btn-alchemist').onclick = () => { setChar('player_alchemist'); };
        document.getElementById('btn-angel').onclick = () => { setChar('player_angel'); };
        function setChar(k) {
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + (k === 'player_sage' ? 'sage' : k === 'player_alchemist' ? 'alchemist' : 'angel')).classList.add('active');
            loadTexture(k);
        }
        document.getElementById('btn-play').onclick = () => playing ? stop() : (idx >= commands.length ? (idx = 0, render(0), play()) : play());
        document.getElementById('btn-step').onclick = () => { stop(); step(); };
        document.getElementById('btn-restart').onclick = () => { stop(); idx = 0; render(0); };
        document.getElementById('btn-grid').onclick = () => {
            gridOn = !gridOn;
            document.getElementById('btn-grid').textContent = 'Grid: ' + (gridOn ? 'on' : 'off');
            render(idx);
        };
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); document.getElementById('btn-play').click(); }
            else if (e.code === 'ArrowRight') { stop(); step(); }
            else if (e.code === 'ArrowLeft') { stop(); if (idx > 0) idx--; render(idx); }
        });

        loadTexture('player_sage');
    </script>
</body>
</html>
